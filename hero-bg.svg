<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071F4D"/>
      <stop offset="45%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#123B7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- world dot grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="120" cy="140" r="2.5"/><circle cx="180" cy="160" r="2.5"/><circle cx="240" cy="130" r="2.5"/>
    <circle cx="300" cy="180" r="2.5"/><circle cx="360" cy="150" r="2.5"/><circle cx="420" cy="200" r="2.5"/>
    <circle cx="900" cy="120" r="2.5"/><circle cx="960" cy="160" r="2.5"/><circle cx="1020" cy="140" r="2.5"/>
    <circle cx="1080" cy="190" r="2.5"/><circle cx="1140" cy="150" r="2.5"/><circle cx="1200" cy="170" r="2.5"/>
    <circle cx="1350" cy="220" r="2.5"/><circle cx="1420" cy="180" r="2.5"/><circle cx="1480" cy="240" r="2.5"/>
  </g>

  <!-- flight path arc: Pokhara to the world -->
  <path d="M180 720 C 500 560, 900 560, 1420 260" stroke="#D4AF37" stroke-width="2" fill="none" stroke-dasharray="10 10" opacity="0.65"/>
  <circle cx="180" cy="720" r="7" fill="#D4AF37"/>
  <circle cx="180" cy="720" r="13" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  <circle cx="1420" cy="260" r="5" fill="#FFFFFF"/>

  <!-- cargo plane silhouette following arc -->
  <g transform="translate(880,470) rotate(-24)">
    <path d="M0 0 L220 -8 L260 0 L220 8 Z" fill="#FFFFFF" opacity="0.92"/>
    <path d="M60 -4 L40 -60 L58 -60 L100 -6 Z" fill="#FFFFFF" opacity="0.92"/>
    <path d="M60 4 L40 60 L58 60 L100 6 Z" fill="#FFFFFF" opacity="0.92"/>
    <path d="M200 -6 L228 -26 L238 -22 L220 -2 Z" fill="#D4AF37"/>
    <path d="M200 6 L228 26 L238 22 L220 2 Z" fill="#D4AF37"/>
  </g>

  <!-- shipping containers silhouette, bottom -->
  <g opacity="0.9">
    <rect x="0" y="800" width="1600" height="100" fill="#06152F"/>
    <rect x="60" y="740" width="150" height="70" rx="4" fill="#0E2C63"/>
    <rect x="60" y="740" width="150" height="70" rx="4" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
    <rect x="230" y="720" width="150" height="90" rx="4" fill="#0A2456"/>
    <rect x="410" y="750" width="130" height="60" rx="4" fill="#0E2C63"/>
    <rect x="1120" y="750" width="130" height="60" rx="4" fill="#0E2C63"/>
    <rect x="1270" y="720" width="150" height="90" rx="4" fill="#0A2456"/>
    <rect x="1270" y="720" width="150" height="90" rx="4" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
    <rect x="1440" y="740" width="150" height="70" rx="4" fill="#0E2C63"/>
  </g>
</svg>
